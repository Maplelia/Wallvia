name: CI

# The release workflow only builds and packages; this one actually runs the
# suite, so a broken test is caught on a push instead of on the tag that cannot
# be taken back.
#
# windows-latest on purpose: the project only supports Windows, and the modules
# under test are Windows-shaped (paths, Steam registry, wallpaper64 process).
#
# It runs `run-all-ci.cjs`, not `run-all.cjs`. A handful of suites need a
# *machine*: a real VS Code install (vscode-css-weight), a real Wallpaper Engine
# library (vscode-smoke's picker half, we-*), or a real browser (cdp-live,
# vscode-video-decode). On a bare runner those fail for environmental reasons,
# and a red badge that means "this box has no Wallpaper Engine" teaches people to
# ignore CI. The excluded files all print SKIPPED locally when their prerequisite
# is missing, so `npm test` on a developer machine still covers everything.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: "1" # a skipped guard is a failure here, not a pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Committed artifacts must match the sources
        run: node scripts/verify-artifact.mjs

      - name: Type check
        run: npx tsc -p obsidian/tsconfig.json --noEmit --skipLibCheck

      - name: Test
        run: node tests/run-all-ci.cjs

      - name: Lint
        run: npm run lint
